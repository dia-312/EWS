<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>لا يوجد اتصال | No connection</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
        background: #f6f7f9;
        color: #171717;
        text-align: center;
      }
      main { max-width: 26rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1rem; color: #404040; line-height: 1.6; }
      button {
        font: inherit;
        padding: 0.6rem 1.4rem;
        border: 0;
        border-radius: 0.5rem;
        background: #171717;
        color: #fff;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تحقّق من اتصالك ثم حاول مرة أخرى.</p>
      <h1 lang="en" dir="ltr">You are offline</h1>
      <p lang="en" dir="ltr">Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة · Retry</button>
    </main>
  </body>
</html>
